<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Quizor 做题家 — 纯静态题库刷题应用" />
    <title>Quizor · 做题家</title>
    <style>
      /*
       * 首屏骨架屏：内联在这里而不是放进 Vue 组件，因为 Vue 要等 JS 下载并执行完才挂载，
       * 而这份骨架随 HTML 一起到达，能在 JS 到位前就画出页面结构，消除白屏。
       * 挂载时 Vue 会整体替换 #app 的内容，无需手动移除。
       */
      html,
      body {
        margin: 0;
        background: #f8fafc;
      }
      .boot-skeleton {
        max-width: 960px;
        margin: 0 auto;
        padding: 20px 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      .boot-skeleton .bar {
        height: 12px;
        border-radius: 6px;
        background: linear-gradient(90deg, #eef2f7 25%, #e2e8f0 37%, #eef2f7 63%);
        background-size: 400% 100%;
        animation: boot-shimmer 1.4s ease-in-out infinite;
      }
      .boot-skeleton .card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 16px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      }
      .boot-skeleton .row {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .boot-skeleton .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .boot-skeleton .title {
        font-size: 14px;
        font-weight: 600;
        color: #64748b;
        margin-bottom: 16px;
      }
      .boot-skeleton .hint {
        margin-top: 8px;
        font-size: 13px;
        color: #94a3b8;
      }
      @keyframes boot-shimmer {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: 0 0;
        }
      }
      @media (max-width: 768px) {
        .boot-skeleton .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      /* 深色模式：跟随系统偏好，避免在深色环境下闪一屏白 */
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0f172a;
        }
        .boot-skeleton .card {
          background: #1e2937;
          border-color: #334155;
        }
        .boot-skeleton .bar {
          background: linear-gradient(90deg, #1e2937 25%, #334155 37%, #1e2937 63%);
          background-size: 400% 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-skeleton">
        <div class="card">
          <div class="bar" style="width: 30%; height: 18px"></div>
          <div class="row" style="margin-top: 16px">
            <div class="bar" style="flex: 1; height: 32px"></div>
          </div>
        </div>
        <div class="card">
          <div class="title">正在加载题库…</div>
          <div class="grid">
            <div class="bar" style="height: 48px"></div>
            <div class="bar" style="height: 48px"></div>
            <div class="bar" style="height: 48px"></div>
            <div class="bar" style="height: 48px"></div>
          </div>
          <div class="hint">题库全文约 5MB，已改为按需加载，首屏只取轻量索引</div>
        </div>
        <div class="card">
          <div class="bar" style="width: 60%; height: 14px"></div>
          <div class="bar" style="width: 100%; height: 14px; margin-top: 12px"></div>
          <div class="bar" style="width: 80%; height: 14px; margin-top: 12px"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
